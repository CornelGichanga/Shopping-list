<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       , initial-scale=1.0">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main class="container">
        <h1>My Shopping List</h1>
        
        
<form id="shopping-form">
  <div class="form-row">
    <div class="form-group">
      <label for="item-name">Item name</label>
      <input
        type="text"
        id="item-name"
        placeholder="e.g. Bread"
      >
    </div>

    <div class="form-group">
      <label for="item-quantity">Quantity</label>
      <input
         type="number"
        id="item-quantity"
        min="1"
        step="1"
        value="1"
        required

      >
    </div>

    <div class="form-group">
      <label for="item-price">Price per item (KSh)</label>
      <input
        type="number"
        id="item-price"
        min="0"
        step="0.01"
        placeholder="0.00"
        required
      >
    </div>

    <button type="submit" id="add-button">Add Item</button>
  </div>
</form>

                <section class="summary">
                    <p>Total cost:<strong id="total-cost">ksh 0.00</strong></p>
                    <p>Purchased: <strong id="purchased-cost">KSh 0.00</strong></p>
                     <p>Items remaining: <strong id="remaining-count">0</strong></p>
                </section>

                <h2>Items</h2>
                <ul id="shopping-list"></ul>

                <button type="button" id="clear-button">Clear List</button>      
    </main>
    <script src="main.js"></script>
</body>
</html>
